name: CI Benchmark & Verification Suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff numpy pytest pytest-cov
      - name: Lint
        run: ruff check .
      - name: Tests with coverage (fails under 90%)
        run: python -m pytest --cov --cov-report=xml --cov-report=html:htmlcov --cov-report=term-missing --cov-fail-under=90
      - name: Add test and coverage summary
        if: always()
        run: |
          echo "### Test & Coverage Summary (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage.xml ]; then
            COVERAGE_PCT=$(python -c 'import xml.etree.ElementTree as ET; print("%.2f%%" % (100 * float(ET.parse("coverage.xml").getroot().attrib["line-rate"])))')
            echo "- Line coverage: **$COVERAGE_PCT**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Coverage XML was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload HTML coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-python-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Example outputs are reproduced byte-for-byte
        run: |
          python -m oes_resilience run --quiet --no-trials --out-dir "$RUNNER_TEMP/ex" --prefix baseline --strict
          python -m oes_resilience sweep --quiet --out-dir "$RUNNER_TEMP/ex" --prefix sweep
          python -m oes_resilience compare --quiet --verify --out-dir "$RUNNER_TEMP/ex" --prefix compare
          python -m oes_resilience stress --quiet --verify --out-dir "$RUNNER_TEMP/ex" --prefix stress
          python -m oes_resilience stress --quiet --burst-mean 0.3 --correlated-mean 0.3 --out-dir "$RUNNER_TEMP/ex" --prefix stress_burst03
          cmp "$RUNNER_TEMP/ex/baseline_summary.csv" examples/baseline_summary.csv
          cmp "$RUNNER_TEMP/ex/sweep_summary.csv" examples/sweep_summary.csv
          cmp "$RUNNER_TEMP/ex/compare_scorecard.csv" examples/compare_scorecard.csv
          cmp "$RUNNER_TEMP/ex/stress_scorecard.csv" examples/stress_scorecard.csv
          cmp "$RUNNER_TEMP/ex/stress_burst03_scorecard.csv" examples/stress_burst03_scorecard.csv
      - name: Replay example scorecards are reproduced byte-for-byte
        run: |
          python -m oes_resilience replay --write-example-inputs "$RUNNER_TEMP/rp"
          python -m oes_resilience replay --input "$RUNNER_TEMP/rp/synthetic_replay.jsonl" --prereg examples/replay_prereg_calibrated.json --calibration "$RUNNER_TEMP/rp/synthetic_calibration.jsonl" --out-dir "$RUNNER_TEMP/ex" --prefix replay --verify --quiet
          python -m oes_resilience replay --input "$RUNNER_TEMP/rp/synthetic_replay.jsonl" --prereg examples/replay_prereg_fixed050.json --out-dir "$RUNNER_TEMP/ex" --prefix replay_fixed050 --verify --quiet
          cmp "$RUNNER_TEMP/ex/replay_scorecard.csv" examples/replay_scorecard.csv
          cmp "$RUNNER_TEMP/ex/replay_fixed050_scorecard.csv" examples/replay_fixed050_scorecard.csv
      - name: pip install and run the console script
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          oes-resilience --version
          oes-resilience run --trials 50 --quiet --strict --out-dir smoke
          oes-resilience compare --trials 50 --streams 20 --calibration-streams 50 --fit-streams 20 --quiet --out-dir smoke
          oes-resilience stress --trials 50 --streams 20 --calibration-streams 50 --fit-streams 20 --quiet --out-dir smoke
          oes-resilience replay --write-example-inputs rp
          oes-resilience replay --input rp/synthetic_replay.jsonl --prereg "$GITHUB_WORKSPACE/examples/replay_prereg_fixed050.json" --quiet --out-dir smoke
          python -c "import oes_resilience as o; assert 'oes32' in o.available_detectors(); print(o.__version__)"

  optional-iforest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install ".[test,iforest]"
      - name: Tests including the optional Isolation Forest detector
        run: python -m pytest --cov --cov-fail-under=90
      - name: Compare with iforest (small run)
        run: oes-resilience compare --detectors oes32,zscore,iforest --tracks frame --trials 200 --quiet --out-dir "$RUNNER_TEMP/if"
      - name: Stress with iforest (small run; dropout rows are reported as unsupported)
        run: oes-resilience stress --detectors oes32,iforest --tracks frame --trials 200 --quiet --out-dir "$RUNNER_TEMP/if"
